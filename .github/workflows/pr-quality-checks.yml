name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Skip docs-only PRs. Safe today because no branch protection rule
    # requires this workflow; if that changes, drop paths-ignore or use the
    # GitHub "dummy required check" pattern (sibling workflow with same job
    # name on inverse paths) to avoid leaving the required check "pending".
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL for prisma generate (postinstall) — no actual DB connection is made
  DATABASE_URL: postgresql://localhost:5432/dummy

jobs:
  # Quality checks and tests share the same setup (checkout, pnpm, node, install).
  # Running them as a single job avoids paying for two ~2 min setup phases per PR;
  # parallelism via artifact-shared node_modules is more expensive than serial.
  quality:
    name: Quality & Tests
    runs-on: ubuntu-latest
    env:
      # Turbo remote cache (Vercel free tier). Scoped to this job rather than
      # the workflow so third-party actions in `react-doctor` cannot read the
      # token. Empty values (e.g. Dependabot PRs without the secret) make Turbo
      # silently fall back to local cache — no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "9.0.0"

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Build i18n package
        run: pnpm turbo run build --filter=@qarote/i18n

      - name: 🔍 Check package version consistency
        run: pnpm run syncpack:check

      - name: 🔍 Type Check
        run: pnpm turbo run type-check --filter=qarote-api

      - name: 🔍 Knip (unused code check)
        run: pnpm run knip

      - name: 🧹 Lint
        run: pnpm turbo run lint --filter=qarote-api

      - name: 💅 Format Check
        run: pnpm turbo run format --filter=qarote-api

      - name: 🌐 Validate i18n keys
        run: pnpm run validate:i18n

      - name: 🧪 Run API Tests
        run: pnpm turbo run test:run --filter=qarote-api

      - name: 🧪 Run App Tests
        run: pnpm turbo run test:run --filter=qarote-app
