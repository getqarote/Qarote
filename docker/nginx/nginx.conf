server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers (shared include for all location blocks)
    include /etc/nginx/conf.d/security-headers.conf;

    # MCP clients (Claude Code, Cursor, …) probe these paths to discover whether
    # the server speaks OAuth before falling back to header auth. The SPA
    # catch-all at the bottom would answer 200 with index.html; the client then
    # JSON.parses "<!doctype html>" and dies with `Unrecognized token '<'`,
    # reporting the server as unreachable rather than as "no OAuth here".
    # 404 is the correct negative answer.
    #
    # Deliberately scoped to the two OAuth paths, NOT all of /.well-known/ —
    # /.well-known/acme-challenge/ must keep resolving or certificate issuance
    # breaks on deployments that terminate TLS in front of this container.
    # `(?:/|$)` keeps the match on a path-component boundary. Without it the
    # prefix would also swallow unrelated names such as
    # /.well-known/oauth-protected-resource-v2. The trailing-slash form is
    # intentional: RFC 8414 and RFC 9728 allow an issuer path suffix
    # (/.well-known/oauth-authorization-server/tenant), which is equally not
    # something we serve.
    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource)(?:/|$) {
        access_log off;
        return 404;
    }

    # Runtime config — MUST come before the generic *.js block below, otherwise
    # the year-long immutable cache traps stale tenant URLs and breaks the
    # multi-tenant GHCR image. The entrypoint rewrites this file on every
    # container start (docker/nginx/docker-entrypoint.d/10-runtime-config.sh).
    location = /config.js {
        add_header Cache-Control "no-store, no-cache" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Cache static assets (nginx add_header in location blocks does NOT inherit
    # from parent — include security headers explicitly)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Locale files are NOT fingerprinted: same URL, new content on every
    # release. A max-age therefore guarantees a window after each deploy where
    # a client holds the old bundle and renders raw keys ("sees.concerns.view")
    # for anything newly added. `no-cache` keeps the file cached but forces
    # revalidation, so the ETag below turns the repeat fetch into a ~200-byte
    # 304 — not the max-age=0 waterfall the previous comment worried about.
    location /locales/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Handle client-side routing - redirect all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
